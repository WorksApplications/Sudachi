# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Create release draft

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: 11
        distribution: temurin
        cache: gradle
    - name: Extract tag version
      id: tag
      run: echo "version=$(echo ${{ github.ref }} | sed -e 's/refs\/tags\/v//')" >> "$GITHUB_OUTPUT"
    - name: Build Distribution Archive
      run: ./gradlew --no-daemon --info --stacktrace assembleExecutableDist
    - name: Rename asset
      env:
        RELEASE_TAG: ${{ steps.tag.outputs.version }}
      run: |
        mkdir dist/
        mv build/distributions/sudachi-executable-$RELEASE_TAG.zip \
          dist/sudachi-$RELEASE_TAG-executable.zip

    - name: Create or reuse release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ steps.tag.outputs.version }}
      run: |
        if gh release view "v$RELEASE_TAG" >/dev/null 2>&1; then
          echo "Release already exists for v$RELEASE_TAG"
          exit 0
        fi
        gh release create "v$RELEASE_TAG" \
          --draft \
          --verify-tag \
          --title "Sudachi version $RELEASE_TAG" \
          --generate-notes
    - name: Upload assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ steps.tag.outputs.version }}
      run: gh release upload "v$RELEASE_TAG" dist/* --clobber -R "${{ github.repository }}"
